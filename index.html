<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#126b62">
  <title>الصندوق التكافلي بأمتريبات</title>
  <style>
    :root {
      --g: #126b62;
      --gd: #0b514a;
      --bg: #f4f7f6;
      --ink: #20302d;
      --muted: #697874;
      --line: #e1e9e6;
      --white: #fff;
      --gold: #d5a848;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
    }

    header {
      background: linear-gradient(135deg, var(--gd), var(--g));
      color: white;
      padding: 20px 14px;
    }

    .wrap {
      width: min(100% - 24px, 900px);
      margin: auto;
    }

    .brand { font-size: 20px; font-weight: 800; }
    .sub { font-size: 13px; color: #d9eeea; margin-top: 4px; }

    nav {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-top: 17px;
      padding-bottom: 2px;
    }

    nav button {
      white-space: nowrap;
      border: 1px solid #ffffff55;
      background: #ffffff16;
      color: white;
      border-radius: 20px;
      padding: 9px 13px;
    }

    nav button.on {
      background: #fff;
      color: var(--gd);
    }

    main { padding: 18px 0 36px; }
    h2 { font-size: 20px; margin: 0 0 14px; }
    h3 { font-size: 16px; margin: 0 0 12px; }

    .card, .stat {
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 15px;
      padding: 15px;
      margin-bottom: 13px;
      box-shadow: 0 5px 18px #164c4410;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 13px;
    }

    .stat { margin: 0; }
    .label, .muted { color: var(--muted); font-size: 13px; }
    .num {
      font-size: 24px;
      font-weight: 800;
      color: var(--gd);
      margin-top: 5px;
    }

    form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 11px;
    }

    .field { display: flex; flex-direction: column; gap: 5px; }
    .full, .actions { grid-column: 1 / -1; }

    label { font-size: 13px; font-weight: 650; }

    input, select, textarea {
      width: 100%;
      padding: 11px;
      border: 1px solid #d5dfdc;
      border-radius: 10px;
      background: white;
      font: inherit;
    }

    textarea { min-height: 80px; resize: vertical; }
    button { font: inherit; cursor: pointer; }

    .btn {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      background: var(--g);
      color: white;
      font-weight: 700;
    }

    .btn.light { background: #e8f5f1; color: var(--gd); }
    .btn.delete { background: #fff0ef; color: #a52a21; }
    .btn.small { padding: 7px 10px; font-size: 12px; }

    .actions { display: flex; gap: 8px; flex-wrap: wrap; }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 540px;
    }

    th, td {
      text-align: right;
      border-bottom: 1px solid var(--line);
      padding: 10px 8px;
      font-size: 13px;
    }

    th { color: var(--muted); }
    .scroll { overflow-x: auto; }

    .empty {
      padding: 18px;
      text-align: center;
      border: 1px dashed #cbd8d4;
      border-radius: 11px;
      color: var(--muted);
    }

    .rule { border-right: 4px solid var(--gold); }
    .rule p { white-space: pre-wrap; line-height: 1.8; }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      padding: 10px;
    }

    @media (max-width: 520px) {
      form { grid-template-columns: 1fr; }
      .full, .actions { grid-column: auto; }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <div class="brand">🤝 الصندوق التكافلي بأمتريبات</div>
      <div class="sub">نموذج تجريبي لإدارة شؤون الصندوق</div>
      <nav id="nav" aria-label="القائمة الرئيسية">
        <button type="button" class="on" data-page="home">الرئيسية</button>
        <button type="button" data-page="members">الأعضاء</button>
        <button type="button" data-page="dues">الاشتراكات</button>
        <button type="button" data-page="requests">طلبات المساعدة</button>
        <button type="button" data-page="rules">اللوائح الداخلية</button>
      </nav>
    </div>
  </header>

  <main class="wrap" id="app"></main>
  <footer>نسخة تجريبية محلية — لا تستخدمها لحفظ بيانات حقيقية أو حساسة.</footer>

  <script>
    (() => {
      "use strict";

      const KEY = "amtrabat_fund_demo_v1";
      const app = document.getElementById("app");
      let page = "home";

      function blankData() {
        return { members: [], dues: [], requests: [], rules: [] };
      }

      function loadData() {
        try {
          const saved = JSON.parse(localStorage.getItem(KEY) || "null");
          if (!saved || typeof saved !== "object") return blankData();

          return {
            members: Array.isArray(saved.members) ? saved.members : [],
            dues: Array.isArray(saved.dues) ? saved.dues : [],
            requests: Array.isArray(saved.requests) ? saved.requests : [],
            rules: Array.isArray(saved.rules) ? saved.rules : []
          };
        } catch {
          return blankData();
        }
      }

      let data = loadData();

      function save() {
        try {
          localStorage.setItem(KEY, JSON.stringify(data));
          return true;
        } catch {
          alert("تعذر حفظ البيانات في المتصفح. قد تكون مساحة التخزين ممتلئة أو غير متاحة.");
          return false;
        }
      }

      function esc(value) {
        return String(value ?? "").replace(/[&<>"']/g, char => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        })[char]);
      }

      function makeId() {
        return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
      }

      function memberName(memberId) {
        const member = data.members.find(item => item.id === memberId);
        return member ? member.name : "عضو محذوف";
      }

      function memberOptions() {
        return data.members.map(member =>
          `<option value="${esc(member.id)}">${esc(member.name)} (${esc(member.no)})</option>`
        ).join("");
      }

      function money(value) {
        const amount = Number(value);
        return (Number.isFinite(amount) ? amount : 0).toLocaleString("ar");
      }

      function dueStatus(value) {
        return value === "paid" ? "مدفوع" : "غير مدفوع";
      }

      function setPage(nextPage) {
        page = nextPage;
        document.querySelectorAll("#nav button").forEach(button => {
          button.classList.toggle("on", button.dataset.page === page);
        });
        render();
      }

      document.getElementById("nav").addEventListener("click", event => {
        const button = event.target.closest("[data-page]");
        if (button) setPage(button.dataset.page);
      });

      function home() {
        const paid = data.dues
          .filter(item => item.status === "paid")
          .reduce((sum, item) => sum + (Number(item.amount) || 0), 0);

        const openRequests = data.requests.filter(item =>
          item.status === "جديد" || item.status === "قيد المراجعة"
        ).length;

        return `
          <h2>الرئيسية</h2>
          <section class="stats">
            <div class="stat"><div class="label">عدد الأعضاء</div><div class="num">${data.members.length}</div></div>
            <div class="stat"><div class="label">إجمالي الاشتراكات المدفوعة</div><div class="num">${money(paid)}</div></div>
            <div class="stat"><div class="label">طلبات المساعدة</div><div class="num">${data.requests.length}</div></div>
            <div class="stat"><div class="label">طلبات قيد المتابعة</div><div class="num">${openRequests}</div></div>
          </section>
          <section class="card">
            <h3>مرحبًا بك</h3>
            <p class="muted">استخدم القائمة لإدارة الأعضاء والاشتراكات والطلبات واللوائح. البيانات محفوظة على هذا الجهاز فقط.</p>
            <button type="button" class="btn light" id="backup">تنزيل نسخة احتياطية</button>
            <button type="button" class="btn light" id="clear">مسح بيانات التجربة</button>
          </section>`;
      }

      function members() {
        const rows = data.members.map(member => `
          <tr>
            <td>${esc(member.no)}</td>
            <td>${esc(member.name)}</td>
            <td>${esc(member.phone || "—")}</td>
            <td>${esc(member.status || "نشط")}</td>
            <td><button type="button" class="btn delete small" data-del="members" data-id="${esc(member.id)}">حذف</button></td>
          </tr>`).join("");

        return `
          <h2>الأعضاء</h2>
          <section class="card">
            <h3>إضافة عضو</h3>
            <form id="memberForm">
              <div class="field"><label for="memberName">اسم العضو</label><input id="memberName" name="name" required maxlength="100"></div>
              <div class="field"><label for="memberNo">رقم العضوية</label><input id="memberNo" name="no" required maxlength="50"></div>
              <div class="field"><label for="memberPhone">رقم الهاتف</label><input id="memberPhone" name="phone" type="tel" maxlength="30"></div>
              <div class="field">
                <label for="memberStatus">الحالة</label>
                <select id="memberStatus" name="status">
                  <option>نشط</option><option>قيد المراجعة</option><option>موقوف</option>
                </select>
              </div>
              <div class="actions"><button class="btn">حفظ العضو</button></div>
            </form>
          </section>
          <section class="card">
            <h3>قائمة الأعضاء</h3>
            ${rows ? `
              <div class="scroll"><table>
                <thead><tr><th>رقم العضوية</th><th>الاسم</th><th>الهاتف</th><th>الحالة</th><th>إجراء</th></tr></thead>
                <tbody>${rows}</tbody>
              </table></div>` : `<div class="empty">لا يوجد أعضاء بعد.</div>`}
          </section>`;
      }

      function dues() {
        const rows = data.dues.map(item => `
          <tr>
            <td>${esc(memberName(item.mid))}</td>
            <td>${esc(item.period)}</td>
            <td>${money(item.amount)}</td>
            <td>${dueStatus(item.status)}</td>
            <td><button type="button" class="btn delete small" data-del="dues" data-id="${esc(item.id)}">حذف</button></td>
          </tr>`).join("");

        return `
          <h2>الاشتراكات</h2>
          <section class="card">
            <h3>تسجيل اشتراك</h3>
            ${data.members.length ? `
              <form id="dueForm">
                <div class="field"><label for="dueMember">العضو</label><select id="dueMember" name="mid" required>${memberOptions()}</select></div>
                <div class="field"><label for="duePeriod">الفترة</label><input id="duePeriod" name="period" required maxlength="50" placeholder="مثال: يناير 2026"></div>
                <div class="field"><label for="dueAmount">المبلغ</label><input id="dueAmount" name="amount" type="number" min="0.01" step="0.01" required></div>
                <div class="field">
                  <label for="dueStatus">حالة السداد</label>
                  <select id="dueStatus" name="status">
                    <option value="unpaid">غير مدفوع</option><option value="paid">مدفوع</option>
                  </select>
                </div>
                <div class="actions"><button class="btn">حفظ الاشتراك</button></div>
              </form>` : `<div class="empty">أضف عضوًا أولًا.</div>`}
          </section>
          <section class="card">
            <h3>سجل الاشتراكات</h3>
            ${rows ? `
              <div class="scroll"><table>
                <thead><tr><th>العضو</th><th>الفترة</th><th>المبلغ</th><th>الحالة</th><th>إجراء</th></tr></thead>
                <tbody>${rows}</tbody>
              </table></div>` : `<div class="empty">لا توجد اشتراكات مسجلة.</div>`}
          </section>`;
      }

      function requests() {
        const rows = data.requests.map(item => `
          <tr>
            <td>${esc(memberName(item.mid))}</td>
            <td>${esc(item.type)}</td>
            <td>${money(item.amount)}</td>
            <td>${esc(item.status || "جديد")}</td>
            <td><button type="button" class="btn delete small" data-del="requests" data-id="${esc(item.id)}">حذف</button></td>
          </tr>`).join("");

        return `
          <h2>طلبات المساعدة</h2>
          <section class="card">
            <h3>إضافة طلب</h3>
            ${data.members.length ? `
              <form id="requestForm">
                <div class="field"><label for="requestMember">العضو</label><select id="requestMember" name="mid" required>${memberOptions()}</select></div>
                <div class="field"><label for="requestType">نوع المساعدة</label><input id="requestType" name="type" required maxlength="100"></div>
                <div class="field"><label for="requestAmount">المبلغ المطلوب</label><input id="requestAmount" name="amount" type="number" min="0" step="0.01" value="0"></div>
                <div class="field">
                  <label for="requestStatus">الحالة</label>
                  <select id="requestStatus" name="status">
                    <option>جديد</option><option>قيد المراجعة</option><option>مقبول</option><option>مرفوض</option>
                  </select>
                </div>
                <div class="field full"><label for="requestReason">سبب الطلب</label><textarea id="requestReason" name="reason" required maxlength="2000"></textarea></div>
                <div class="actions"><button class="btn">حفظ الطلب</button></div>
              </form>` : `<div class="empty">أضف عضوًا أولًا.</div>`}
          </section>
          <section class="card">
            <h3>الطلبات المسجلة</h3>
            ${rows ? `
              <div class="scroll"><table>
                <thead><tr><th>العضو</th><th>نوع المساعدة</th><th>المبلغ</th><th>الحالة</th><th>إجراء</th></tr></thead>
                <tbody>${rows}</tbody>
              </table></div>` : `<div class="empty">لا توجد طلبات مساعدة.</div>`}
          </section>`;
      }

      function rules() {
        const cards = data.rules.map(rule => `
          <article class="card rule">
            <h3>${esc(rule.title)}</h3>
            <div class="muted">${esc(rule.status)} — ${esc(rule.date)}</div>
            <p>${esc(rule.text)}</p>
            <button type="button" class="btn delete small" data-del="rules" data-id="${esc(rule.id)}">حذف</button>
          </article>`).join("");

        return `
          <h2>اللوائح الداخلية</h2>
          <section class="card">
            <h3>إضافة لائحة أو إعلان</h3>
            <form id="ruleForm">
              <div class="field"><label for="ruleTitle">العنوان</label><input id="ruleTitle" name="title" required maxlength="150"></div>
              <div class="field">
                <label for="ruleStatus">الحالة</label>
                <select id="ruleStatus" name="status"><option>منشورة</option><option>مسودة</option></select>
              </div>
              <div class="field full"><label for="ruleText">النص</label><textarea id="ruleText" name="text" required maxlength="5000"></textarea></div>
              <div class="actions"><button class="btn">حفظ اللائحة</button></div>
            </form>
          </section>
          ${cards || '<div class="empty">لا توجد لوائح مضافة.</div>'}`;
      }

      function render() {
        const pages = { home, members, dues, requests, rules };
        app.innerHTML = (pages[page] || home)();
      }

      app.addEventListener("submit", event => {
        const form = event.target;
        if (!(form instanceof HTMLFormElement)) return;

        event.preventDefault();
        const values = Object.fromEntries(new FormData(form).entries());

        if (form.id === "memberForm") {
          const name = String(values.name || "").trim();
          const no = String(values.no || "").trim();
          const duplicate = data.members.some(member =>
            String(member.no || "").trim().toLowerCase() === no.toLowerCase()
          );

          if (!name || !no) {
            alert("يرجى إدخال اسم العضو ورقم العضوية.");
            return;
          }
          if (duplicate) {
            alert("رقم العضوية مستخدم بالفعل.");
            return;
          }

          data.members.push({
            id: makeId(),
            name,
            no,
            phone: String(values.phone || "").trim(),
            status: String(values.status || "نشط")
          });
        } else if (form.id === "dueForm") {
          const amount = Number(values.amount);
          if (!Number.isFinite(amount) || amount <= 0) {
            alert("أدخل مبلغًا صحيحًا أكبر من صفر.");
            return;
          }

          data.dues.push({
            id: makeId(),
            mid: String(values.mid || ""),
            period: String(values.period || "").trim(),
            amount,
            status: values.status === "paid" ? "paid" : "unpaid"
          });
        } else if (form.id === "requestForm") {
          const amount = Number(values.amount || 0);
          if (!Number.isFinite(amount) || amount < 0) {
            alert("أدخل مبلغًا صحيحًا لا يقل عن صفر.");
            return;
          }

          data.requests.push({
            id: makeId(),
            mid: String(values.mid || ""),
            type: String(values.type || "").trim(),
            amount,
            reason: String(values.reason || "").trim(),
            status: String(values.status || "جديد")
          });
        } else if (form.id === "ruleForm") {
          data.rules.push({
            id: makeId(),
            title: String(values.title || "").trim(),
            status: String(values.status || "مسودة"),
            text: String(values.text || "").trim(),
            date: new Date().toLocaleDateString("ar")
          });
        } else {
          return;
        }

        if (save()) render();
      });

      app.addEventListener("click", event => {
        const deleteButton = event.target.closest("[data-del]");

        if (deleteButton) {
          const collection = deleteButton.dataset.del;
          const itemId = deleteButton.dataset.id;
          const allowedCollections = ["members", "dues", "requests", "rules"];

          if (!allowedCollections.includes(collection)) return;
          if (!confirm("هل أنت متأكد من حذف هذا السجل؟")) return;

          if (collection === "members") {
            data.members = data.members.filter(item => item.id !== itemId);
          } else {
            data[collection] = data[collection].filter(item => item.id !== itemId);
          }

          if (save()) render();
          return;
        }

        if (event.target.closest("#backup")) {
          try {
            const blob = new Blob(
              [JSON.stringify(data, null, 2)],
              { type: "application/json;charset=utf-8" }
            );
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            link.download = "نسخة-الصندوق.json";
            document.body.appendChild(link);
            link.click();
            link.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
          } catch {
            alert("تعذر إنشاء النسخة الاحتياطية.");
          }
          return;
        }

        if (event.target
