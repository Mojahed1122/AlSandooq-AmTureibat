<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#126b62">
<title>الصندوق التكافلي بأمتريبات</title>
<style>
:root{--g:#126b62;--gd:#0b514a;--bg:#f4f7f6;--ink:#20302d;--muted:#697874;--line:#e1e9e6;--white:#fff;--gold:#d5a848}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
header{background:linear-gradient(135deg,var(--gd),var(--g));color:white;padding:20px 14px}
.wrap{width:min(100% - 24px,900px);margin:auto}
.brand{font-size:20px;font-weight:800}
.sub{font-size:13px;color:#d9eeea;margin-top:4px}
nav{display:flex;gap:8px;overflow:auto;margin-top:17px}
nav button{white-space:nowrap;border:1px solid #ffffff55;background:#ffffff16;color:white;border-radius:20px;padding:9px 13px}
nav button.on{background:#fff;color:var(--gd)}
main{padding:18px 0 36px}
h2{font-size:20px;margin:0 0 14px}
h3{font-size:16px;margin:0 0 12px}
.card,.stat{background:var(--white);border:1px solid var(--line);border-radius:15px;padding:15px;margin-bottom:13px;box-shadow:0 5px 18px #164c4410}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:13px}
.stat{margin:0}.label,.muted{color:var(--muted);font-size:13px}.num{font-size:24px;font-weight:800;color:var(--gd);margin-top:5px}
form{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.field{display:flex;flex-direction:column;gap:5px}.full,.actions{grid-column:1/-1}
label{font-size:13px;font-weight:650}
input,select,textarea{width:100%;padding:11px;border:1px solid #d5dfdc;border-radius:10px;background:white;font:inherit}
textarea{min-height:80px;resize:vertical}
button{font:inherit;cursor:pointer}
.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--g);color:white;font-weight:700}
.btn.light{background:#e8f5f1;color:var(--gd)}.btn.delete{background:#fff0ef;color:#a52a21}
.btn.small{padding:7px 10px;font-size:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;min-width:540px}
th,td{text-align:right;border-bottom:1px solid var(--line);padding:10px 8px;font-size:13px}
th{color:var(--muted)}.scroll{overflow:auto}
.empty{padding:18px;text-align:center;border:1px dashed #cbd8d4;border-radius:11px;color:var(--muted)}
.rule{border-right:4px solid var(--gold)}.rule p{white-space:pre-wrap;line-height:1.8}
footer{text-align:center;color:var(--muted);font-size:12px;padding:10px}
@media(max-width:520px){form{grid-template-columns:1fr}.full,.actions{grid-column:auto}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand">🤝 الصندوق التكافلي بأمتريبات</div>
    <div class="sub">نموذج تجريبي لإدارة شؤون الصندوق</div>
    <nav id="nav">
      <button class="on" data-page="home">الرئيسية</button>
      <button data-page="members">الأعضاء</button>
      <button data-page="dues">الاشتراكات</button>
      <button data-page="requests">طلبات المساعدة</button>
      <button data-page="rules">اللوائح الداخلية</button>
    </nav>
  </div>
</header>
<main class="wrap" id="app"></main>
<footer>نسخة تجريبية محلية — لا تستخدمها لحفظ بيانات حقيقية أو حساسة.</footer>

<script>
(function(){
"use strict";
const KEY="amtrabat_fund_demo_v1";
const blank={members:[],dues:[],requests:[],rules:[]};
let data;
try{data=JSON.parse(localStorage.getItem(KEY)||"null")||blank}catch(e){data=blank}
let page="home";
const app=document.getElementById("app");

function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert("تعذر حفظ البيانات في المتصفح.")}}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function memberName(mid){let m=data.members.find(x=>x.id===mid);return m?m.name:"—"}
function options(){return data.members.map(m=>`<option value="${esc(m.id)}">${esc(m.name)} (${esc(m.no)})</option>`).join("")}
function money(n){return Number(n||0).toLocaleString("ar")}
function setPage(p){page=p;document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.page===p));render()}
document.getElementById("nav").addEventListener("click",e=>{let b=e.target.closest("[data-page]");if(b)setPage(b.dataset.page)});

function home(){
 let paid=data.dues.filter(x=>x.status==="paid").reduce((s,x)=>s+Number(x.amount||0),0);
 let open=data.requests.filter(x=>x.status==="جديد"||x.status==="قيد المراجعة").length;
 return `<h2>الرئيسية</h2>
 <section class="stats">
 <div class="stat"><div class="label">عدد الأعضاء</div><div class="num">${data.members.length}</div></div>
 <div class="stat"><div class="label">اشتراكات مدفوعة</div><div class="num">${money(paid)}</div></div>
 <div class="stat"><div class="label">طلبات المساعدة</div><div class="num">${data.requests.length}</div></div>
 <div class="stat"><div class="label">طلبات قيد المتابعة</div><div class="num">${open}</div></div>
 </section>
 <section class="card"><h3>مرحبًا بك</h3><p class="muted">استخدم القائمة لإضافة الأعضاء والاشتراكات والطلبات واللوائح. البيانات محفوظة على هذا الجهاز فقط.</p>
 <button class="btn light" id="backup">تنزيل نسخة احتياطية</button>
 <button class="btn light" id="clear">مسح بيانات التجربة</button></section>`;
}
function members(){
 let rows=data.members.map(m=>`<tr><td>${esc(m.no)}</td><td>${esc(m.name)}</td><td>${esc(m.phone||"—")}</td><td>${esc(m.status)}</td><td><button class="btn delete small" data-del="members" data-id="${esc(m.id)}">حذف</button></td></tr>`).join("");
 return `<h2>الأعضاء</h2><section class="card"><h3>إضافة عضو</h3>
 <form id="memberForm">
 <div class="field"><label>اسم العضو</label><input name="name" required></div>
 <div class="field"><label>رقم العضوية</label><input name="no" required></div>
 <div class="field"><label>رقم الهاتف</label><input name="phone" type="tel"></div>
 <div class="field"><label>الحالة</label><select name="status"><option>نشط</option><option>قيد المراجعة</option><option>موقوف</option></select></div>
 <div class="actions"><button class="btn">حفظ العضو</button></div></form></section>
 <section class="card"><h3>قائمة الأعضاء</h3>${rows?`<div class="scroll"><table><thead><tr><th>رقم العضوية</th><th>الاسم</th><th>الهاتف</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody>${rows}</tbody></table></div>`:`<div class="empty">لا يوجد أعضاء بعد.</div>`}</section>`;
}
function dues(){
 let rows=data.dues.map(x=>`<tr><td>${esc(memberName(x.mid))}</td><td>${esc(x.period)}</td><td>${money(x.amount)}</td><td>${esc(x.status)}</td><td><button class="btn delete small" data-del="dues" data-id="${esc(x.id)}">حذف</button></td></tr>`).join("");
 return `<h2>الاشتراكات</h2><section class="card"><h3>تسجيل اشتراك</h3>
 ${data.members.length?`<form id="dueForm">
 <div class="field"><label>العضو</label><select name="mid" required>${options()}</select></div>
 <div class="field"><label>الفترة</label><input name="period" required placeholder="مثال: يناير 2026"></div>
 <div class="field"><label>المبلغ</label><input name="amount" type="number" min="0.01" step="0.01" required></div>
 <div class="field"><label>حالة السداد</label><select name="status"><option value="unpaid">غير مدفوع</option><option value="paid">مدفوع</option></select></div>
 <div class="actions"><button class="btn">حفظ الاشتراك</button></div></form>`:`<div class="empty">أضف عضوًا أولًا.</div>`}</section>
 <section class="card"><h3>سجل الاشتراكات</h3>${rows?`<div class="scroll"><table><thead><tr><th>العضو</th><th>الفترة</th><th>المبلغ</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody>${rows}</tbody></table></div>`:`<div class="empty">لا توجد اشتراكات مسجلة.</div>`}</section>`;
}
function requests(){
 let rows=data.requests.map(x=>`<tr><td>${esc(memberName(x.mid))}</td><td>${esc(x.type)}</td><td>${money(x.amount)}</td><td>${esc(x.status)}</td><td><button class="btn delete small" data-del="requests" data-id="${esc(x.id)}">حذف</button></td></tr>`).join("");
 return `<h2>طلبات المساعدة</h2><section class="card"><h3>إضافة طلب</h3>
 ${data.members.length?`<form id="requestForm">
 <div class="field"><label>العضو</label><select name="mid" required>${options()}</select></div>
 <div class="field"><label>نوع المساعدة</label><input name="type" required></div>
 <div class="field"><label>المبلغ المطلوب</label><input name="amount" type="number" min="0" step="0.01"></div>
 <div class="field full"><label>سبب الطلب</label><textarea name="reason" required></textarea></div>
 <div class="actions"><button class="btn">حفظ الطلب</button></div></form>`:`<div class="empty">أضف عضوًا أولًا.</div>`}</section>
 <section class="card"><h3>الطلبات المسجلة</h3>${rows?`<div class="scroll"><table><thead><tr><th>العضو</th><th>نوع المساعدة</th><th>المبلغ</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody>${rows}</tbody></table></div>`:`<div class="empty">لا توجد طلبات مساعدة.</div>`}</section>`;
}
function rules(){
 let cards=data.rules.map(r=>`<article class="card rule"><h3>${esc(r.title)}</h3><div class="muted">${esc(r.status)} — ${esc(r.date)}</div><p>${esc(r.text)}</p><button class="btn delete small" data-del="rules" data-id="${esc(r.id)}">حذف</button></article>`).join("");
 return `<h2>اللوائح الداخلية</h2><section class="card"><h3>إضافة لائحة أو إعلان</h3>
 <form id="ruleForm"><div class="field"><label>العنوان</label><input name="title" required></div>
 <div class="field"><label>الحالة</label><select name="status"><option>منشورة</option><option>مسودة</option></select></div>
 <div class="field full"><label>النص</label><textarea name="text" required></textarea></div>
 <div class="actions"><button class="btn">حفظ اللائحة</button></div></form></section>
 ${cards||'<div class="empty">لا توجد لوائح مضافة.</div>'}`;
}
function render(){
 app.innerHTML=({home,members,dues,requests,rules}[page]||home)();
 const backup=document.getElementById("backup");
 if(backup)backup.onclick=()=>{
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="نسخة-الصندوق.json";a.click();URL.revokeObjectURL(a.href);
 };
 const clear=document.getElementById("clear");
 if(clear)clear.onclick=()=>{if(confirm("تمسح كل بيانات التجربة؟")){data={members:[],dues:[],requests:[],rules:[]};save();render()}};
}
app.addEventListener("submit",e=>{
 e.preventDefault();const f=e.target;const x=Object.fromEntries(new FormData(f).entries());
 if(f.id==="memberForm")data.members.push({id:id(),name:x.name.trim(),no:x.no.trim(),phone:x.phone.trim(),status:x.status});
 if(f.id==="
