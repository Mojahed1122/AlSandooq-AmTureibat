<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>الصندوق التكافلي — أم تريبات</title>
  <style>
    :root { --green: #176b52; --green-light: #e8f4ef; --ink: #20312c; --muted: #71817b; --line: #e6ece9; --bg: #f5f8f6; --white: #fff; --red: #b94a48; --amber: #9a6b0a; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Tahoma, Arial, sans-serif; color: var(--ink); background: var(--bg); }
    .topbar { background: var(--white); border-bottom: 1px solid var(--line); padding: 14px 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 2; }
    .brand { font-weight: bold; color: var(--green); font-size: 19px; }
    .role-switch button, .nav button { border: 0; background: transparent; color: var(--muted); padding: 9px 12px; border-radius: 9px; }
    .role-switch button.active, .nav button.active { background: var(--green-light); color: var(--green); font-weight: bold; }
    .layout { display: flex; min-height: calc(100vh - 60px); }
    .sidebar { width: 220px; padding: 24px 16px; background: var(--white); border-left: 1px solid var(--line); }
    .nav { display: grid; gap: 5px; }
    main { flex: 1; padding: 30px 4%; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 15px; margin-bottom: 24px; }
    .card, .panel { background: var(--white); border: 1px solid var(--line); border-radius: 14px; padding: 19px; }
    .card .value { font-size: 24px; font-weight: bold; margin-top: 10px; }
    .panel h2 { font-size: 17px; margin: 0 0 16px; }
    .primary { background: var(--green); color: white; border: 0; border-radius: 9px; padding: 10px 15px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px 10px; text-align: right; border-bottom: 1px solid var(--line); }
    .status { display: inline-block; padding: 5px 9px; border-radius: 20px; background: #f0f2f1; font-size: 12px; }
    .status.new { background: #fff4d9; color: var(--amber); }
    .status.ok { background: #e6f4eb; color: var(--green); }
    input, textarea { width: 100%; padding: 11px; border: 1px solid var(--line); border-radius: 9px; }
  </style>
</head>
<body>
  <header class="topbar"><div class="brand">🌿 الصندوق التكافلي - أم تريبات</div><div class="role-switch"><button id="adminRole" class="active" onclick="setRole('admin')">المشرف</button><button id="memberRole" onclick="setRole('member')">العضو</button></div></header>
  <div class="layout"><aside class="sidebar"><nav class="nav" id="nav"></nav></aside><main><div id="content"></div></main></div>
  <script>
    let requests = [{ id: 1, name: "أحمد محمد", title: "مساعدة علاجية", date: "2026-11-02", status: "قيد المراجعة" }];
    let role = "admin"; let page = "dashboard";
    const adminPages = [["dashboard","لوحة التحكم"],["members","الأعضاء"],["requests","طلبات المساعدة"],["finance","المالية"]];
    const memberPages = [["mydata","ملفي واشتراكاتي"],["myrequests","طلباتي"]];
    function setRole(r){ role=r; page=r==="admin"?"dashboard":"mydata"; document.getElementById("adminRole").classList.toggle("active",r==="admin"); document.getElementById("memberRole").classList.toggle("active",r==="member"); render(); }
    function navigate(p){ page=p; render(); }
    function render(){
      document.getElementById("nav").innerHTML=(role==="admin"?adminPages:memberPages).map(([k,l])=>`<button class="${page===k?"active":""}" onclick="navigate('${k}')">${l}</button>`).join("");
      const c=document.getElementById("content");
      if(role==="admin"&&page==="dashboard"){ c.innerHTML=`<h1>لوحة التحكم</h1><div class="cards"><div class="card"><div>الأعضاء النشطون</div><div class="value">48</div></div><div class="card"><div>إيرادات هذا الشهر</div><div class="value">1,250,000</div></div><div class="card"><div>طلبات تحتاج مراجعة</div><div class="value">${requests.length}</div></div></div><div class="panel"><h2>أحدث الطلبات</h2><table><tr><th>الاسم</th><th>الطلب</th><th>الحالة</th></tr>${requests.map(r=>`<tr><td>${r.name}</td><td>${r.title}</td><td><span class="status new">${r.status}</span></td></tr>`).join("")}</table></div>`; }
      else if(page==="members"){ c.innerHTML=`<h1>الأعضاء</h1><div class="panel"><h2>قائمة الأعضاء</h2><table><tr><th>الاسم</th><th>الرقم</th><th>الحالة</th></tr><tr><td>أحمد محمد</td><td>001</td><td><span class="status ok">نشط</span></td></tr></table></div>`; }
      else if(page==="requests"){ c.innerHTML=`<h1>طلبات المساعدة</h1><div class="panel"><table><tr><th>مقدم الطلب</th><th>نوع الطلب</th><th>الحالة</th></tr>${requests.map(r=>`<tr><td>${r.name}</td><td>${r.title}</td><td>${r.status}</td></tr>`).join("")}</table></div>`; }
      else if(page==="finance"){ c.innerHTML=`<h1>المالية</h1><div class="cards"><div class="card"><div>الرصيد</div><div class="value">3,420,000</div></div></div>`; }
      else { c.innerHTML=`<h1>ملفي واشتراكاتي</h1><div class="panel"><p>الاسم: أحمد محمد - العضوية نشطة ✓</p></div><div class="panel"><h2>تقديم طلب مساعدة</h2><form onsubmit="requests.unshift({id:Date.now(),name:'أحمد محمد',title:this.t.value,date:new Date().toISOString().slice(0,10),status:'جديد'});render();return false;"><input name="t" placeholder="نوع الطلب" required><br><br><button class="primary">إرسال</button></form></div>`; }
    }
    render();
  </script>
</body>
</html>
