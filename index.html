<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>صندوق أم تريبات</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;900&display=swap" rel="stylesheet">
<style>*{font-family:Tajawal}</style>
</head>
<body class="bg-[#f5f7f5]">

<header class="bg-[#0e6b43] text-white p-4 text-center sticky top-0 z-10">
<h1 class="font-black text-lg">صندوق التكافل - أم تريبات</h1>
<p class="text-xs opacity-80">كشوفات الاشتراكات ولمسات الوفاء</p>
</header>

<div class="flex gap-2 p-3 max-w-lg mx-auto">
<button onclick="showTab('oct')" id="btn-oct" class="flex-1 bg-[#0e6b43] text-white py-3 rounded-xl font-bold">أكتوبر (53)</button>
<button onclick="showTab('nov')" id="btn-nov" class="flex-1 bg-white border py-3 rounded-xl font-bold">نوفمبر (21)</button>
<button onclick="showTab('wafa')" id="btn-wafa" class="flex-1 bg-white border py-3 rounded-xl font-bold">وفاء</button>
</div>

<div class="max-w-lg mx-auto p-3">

<div id="tab-oct" class="bg-white rounded-2xl border p-3">
<h2 class="font-black mb-2">اشتراك أكتوبر - 53 عضو ✅</h2>
<div class="text-sm leading-7 h-[60vh] overflow-auto" id="oct-list"></div>
<div class="mt-3 p-3 bg-emerald-50 rounded-xl font-bold">الإجمالي: 53 × 10,000 = 530,000 جنيه</div>
</div>

<div id="tab-nov" class="bg-white rounded-2xl border p-3 hidden">
<h2 class="font-black mb-2">اشتراك نوفمبر - 21 عضو ✅</h2>
<div class="text-sm leading-7 h-[60vh] overflow-auto" id="nov-list"></div>
<div class="mt-3 p-3 bg-emerald-50 rounded-xl font-bold">الإجمالي: 21 × 10,000 = 210,000 جنيه</div>
</div>

<div id="tab-wafa" class="bg-white rounded-2xl border p-3 hidden">
<h2 class="font-black mb-2">لمسة وفاء - 3,311,000 ج</h2>
<p class="text-xs text-zinc-500">حساب 8783249 - أيمن يوسف</p>
<div class="text-sm leading-7 h-[60vh] overflow-auto mt-2">58 متبرع - المجموع 3,311,000 ج (القائمة الكاملة عندك)</div>
</div>

</div>

<script>
const oct = ["محمد احمد حمدان","عمر بشير هجو","التهامي عبدالله","مجاهد صلاح","محمد انورالسادات","أحمد يحيى","بشرى الأمين","أمير ادم","منذر عبدالله","محمد ادم","محمد الباقر عثمان","بادي عبد القادر","منتصر الصديق","امين بابكر","أحمد عبدالوهاب","النور محمد يوسف (4 شهور)","الأمين محمد الأمين","رضوان بلال","خاطر عبدالله","مصطفي النذير","عبد الحميد الزبير","الزبير رجب","أمال عوض","مهند محمد (شهرين)","السر عثمان","حمدالنيل حامد","فتح الرحمن الجعلي","حامد اسماعيل","ضياء الدين","محمد عبدالله بخيت 100ألف","عبدالله محمد عبدالله 100ألف","احمدجادالله 100","ابتهال شهرين","مرتضى آدم","صديق عبد الرحيم","السيده عبدالقادر","مجتبى حامد","منذر جلال","محمد محجوب","شوقى موسي","رافع الامين","عبير عبدالله","الزكي بابكر","أيمن يحيى","محمد الامين 30","سعد مصعب","عبدالعظيم 3شهور","عبدالله الأمين","موسى الطاهر","الفاضل ميرغني","يونس السماني","بشير محمد احمد","ميساء يوسف"];
const nov = ["عبدالعظيم عباس","مهند محمد احمد","النور محمد يوسف","محمد عبدالله بخيت","عبدالله محمد عبدالله","احمد يحي علي","شوقي موسى","زكي بابكر","بشري الأمين","رفع الأمين","محمد الباقر","د. ابتهال عبدالغني","أحمد جادالله","محمد ابراهيم جباره","امين بابكر","السر عثمان","عبدالله الأمين ادم","محمد الامين زين العابدين","الأمين محمد الأمين"];
document.getElementById('oct-list').innerHTML = oct.map((n,i)=>`${i+1}/ ${n} ✅`).join('<br>');
document.getElementById('nov-list').innerHTML = nov.map((n,i)=>`${i+1}/ ${n} ✅`).join('<br>');
function showTab(t){
document.getElementById('tab-oct').classList.add('hidden');
document.getElementById('tab-nov').classList.add('hidden');
document.getElementById('tab-wafa').classList.add('hidden');
document.getElementById('tab-'+t).classList.remove('hidden');
document.getElementById('btn-oct').className = t=='oct' ? 'flex-1 bg-[#0e6b43] text-white py-3 rounded-xl font-bold' : 'flex-1 bg-white border py-3 rounded-xl font-bold';
document.getElementById('btn-nov').className = t=='nov' ? 'flex-1 bg-[#0e6b43] text-white py-3 rounded-xl font-bold' : 'flex-1 bg-white border py-3 rounded-xl font-bold';
document.getElementById('btn-wafa').className = t=='wafa' ? 'flex-1 bg-[#0e6b43] text-white py-3 rounded-xl font-bold' : 'flex-1 bg-white border py-3 rounded-xl font-bold';
}
</script>
</body>
</html>
