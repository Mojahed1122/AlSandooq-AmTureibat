<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#126b62">
  <title>الصندوق التكافلي بأمتريبات</title>

  <style>
    :root {
      --green: #126b62;
      --green-dark: #0b514a;
      --mint: #e8f5f1;
      --gold: #d5a848;
      --bg: #f4f7f6;
      --text: #1f2c2a;
      --muted: #6b7976;
      --border: #e1e9e6;
      --white: #fff;
      --danger: #b42318;
      --shadow: 0 8px 24px rgba(20, 65, 58, .08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
    }

    button, input, select, textarea { font: inherit; }

    .app-header {
      color: white;
      padding: 22px 18px 18px;
      background: linear-gradient(135deg, var(--green-dark), var(--green));
    }

    .header-inner, main {
      width: min(100% - 28px, 980px);
      margin: auto;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      border-radius: 15px;
      background: rgba(255,255,255,.15);
      font-size: 25px;
    }

    h1 { font-size: 20px; margin: 0 0 4px; }
    .subtitle { margin: 0; color: #d6ebe6; font-size: 13px; }

    nav {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 16px 0 2px;
      scrollbar-width: thin;
    }

    nav button {
      flex: 0 0 auto;
      border: 1px solid rgba(255,255,255,.25);
      color: white;
      background: rgba(255,255,255,.09);
      padding: 9px 14px;
      border-radius: 999px;
      cursor: pointer;
    }

    nav button.active, nav button:hover {
      background: white;
      color: var(--green-dark);
    }

    main { padding: 20px 0 40px; }

    .page-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 2px 0 16px;
    }

    .page-title h2 { margin: 0; font-size: 21px; }
    .muted { color: var(--muted); font-size: 13px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .card, .stat {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
    }

    .stat { padding: 16px; }
    .stat-label { color: var(--muted); font-size: 13px; }
    .stat-value { font-size: 25px; font-weight: 750; margin-top: 7px; color: var(--green-dark); }
    .card { padding: 16px; margin-bottom: 14px; }
    .card h3 { margin: 0 0 12px; font-size: 16px; }

    form {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .field { display: flex; flex-direction: column; gap: 6px; }
    .field.full { grid-column: 1 / -1; }

    label { color: #42514e; font-size: 13px; font-weight: 650; }

    input, select, textarea {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #d5dfdc;
      border-radius: 10px;
      background: #fff;
      color: var(--text);
      outline: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(18,107,98,.1);
    }

    textarea { min-height: 84px; resize: vertical; }

    .actions {
      grid-column: 1 / -1;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .btn {
      border: 0;
      border-radius: 10px;
      padding: 10px 15px;
      background: var(--green);
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    .btn:hover { background: var(--green-dark); }
    .btn.secondary { color: var(--green-dark); background: var(--mint); }
    .btn.danger { background: #fff0ef; color: var(--danger); }
    .btn.small { padding: 7px 10px; font-size: 12px; }

    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 580px; }
    th, td {
      padding: 11px 9px;
      text-align: right;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      vertical-align: middle;
    }
    th { color: var(--muted); font-weight: 700; background: #fbfcfc; }

    .badge {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 999px;
      background: var(--mint);
      color: var(--green-dark);
      font-size: 12px;
      white-space: nowrap;
    }

    .badge.warn { background: #fff5dc; color: #815b0b; }
    .badge.red { background: #fff0ef; color: var(--danger); }
    .empty {
      color: var(--muted);
      padding: 22px 10px;
      text-align: center;
      border: 1px dashed #cbd8d4;
      border-radius: 12px;
      background: #fbfdfc;
    }

    .regulation { border-right: 4px solid var(--gold); }
    .regulation p { white-space: pre-wrap; line-height: 1.8; margin-bottom: 0; }
    .footer-note {
      color: var(--muted);
      text-align: center;
      font-size: 12px;
      padding: 8px;
    }

    @media (max-width: 720px) {
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 520px) {
      .grid, form { grid-template-columns: 1fr; }
      .field.full, .actions { grid-column: auto; }
      .page-title h2 { font-size: 19px; }
      .stat { padding: 13px; }
      .stat-value { font-size: 22px; }
    }
  </style>
</head>

<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">🤝</div>
        <div>
          <h1>الصندوق التكافلي بأمتريبات</h1>
          <p class="subtitle">نموذج أولي لإدارة شؤون الصندوق</p>
        </div>
      </div>

      <nav id="navigation" aria-label="القائمة الرئيسية">
        <button class="active" data-page="dashboard">الرئيسية</button>
        <button data-page="members">الأعضاء</button>
        <button data-page="subscriptions">الاشتراكات</button>
        <button data-page="requests">طلبات المساعدة</button>
        <button data-page="regulations">اللوائح الداخلية</button>
      </nav>
    </div>
  </header>

  <main id="app"></main>

  <div class="footer-note">
    نسخة تجريبية محلية — البيانات محفوظة في هذا المتصفح على هذا الجهاز فقط.
  </div>

  <script>
    const STORAGE_KEY = "amtrabat_takaful_app_v1";

    const emptyState = {
      members: [],
      subscriptions: [],
      requests: [],
      regulations: []
    };

    let state = loadState();
    let currentPage = "dashboard";

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        return saved ? { ...emptyState, ...JSON.parse(saved) } : structuredClone(emptyState);
      } catch {
        return { ...emptyState };
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function uid() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    }

    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, ch => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;",
        '"': "&quot;", "'": "&#39;"
      }[ch]));
    }

    function today() {
      return new Date().toISOString().slice(0, 10);
    }

    function money(value) {
      return Number(value || 0).toLocaleString("ar", {
        maximumFractionDigits: 2
      });
    }

    function memberName(id) {
      return state.members.find(m => m.id === id)?.name || "عضو غير معروف";
    }

    function statusLabel(status) {
      const labels = {
        active: "نشط",
        pending: "قيد المراجعة",
        suspended: "موقوف",
        paid: "مدفوع",
        unpaid: "غير مدفوع",
        submitted: "جديد",
        under_review: "قيد المراجعة",
        approved: "مقبول",
        rejected: "مرفوض",
        published: "منشورة",
        draft: "مسودة",
        archived: "مؤرشفة"
      };
      return labels[status] || status || "—";
    }

    function badgeClass(status) {
      if (["rejected", "suspended"].includes(status)) return "badge red";
      if (["pending", "unpaid", "under_review", "draft"].includes(status)) return "badge warn";
      return "badge";
    }

    function setPage(page) {
      currentPage = page;
      document.querySelectorAll("nav button").forEach(button => {
        button.classList.toggle("active", button.dataset.page === page);
      });
      render();
    }

    document.getElementById("navigation").addEventListener("click", event => {
      const button = event.target.closest("[data-page]");
      if (button) setPage(button.dataset.page);
    });

    document.getElementById("app").addEventListener("submit", event => {
      event.preventDefault();
      const form = event.target;

      if (form.id === "memberForm") {
        const data = new FormData(form);
        state.members.push({
          id: uid(),
          name: data.get("name").trim(),
          phone: data.get("phone").trim(),
          number: data.get("number").trim(),
          status: data.get("status"),
          createdAt: today()
        });
        saveState();
        render();
        return;
      }

      if (form.id === "subscriptionForm") {
        const data = new FormData(form);
        state.subscriptions.push({
          id: uid(),
          memberId: data.get("memberId"),
          period: data.get("period").trim(),
          amount: Number(data.get("amount")),
          status: data.get("status"),
          createdAt: today()
        });
        saveState();
        render();
        return;
      }

      if (form.id === "requestForm") {
        const data = new FormData(form);
        state.requests.push({
          id: uid(),
          memberId: data.get("memberId"),
          type: data.get("type").trim(),
          amount: Number(data.get("amount") || 0),
          reason: data.get("reason").trim(),
          status: "submitted",
          createdAt: today()
        });
        saveState();
        render();
        return;
      }

      if (form.id === "regulationForm") {
        const data = new FormData(form);
        state.regulations.push({
          id: uid(),
          title: data.get("title").trim(),
          text: data.get("text").trim(),
          status: data.get("status"),
          createdAt: today()
        });
        saveState();
        render();
      }
    });

    document.getElementById("app").addEventListener("click", event => {
      const deleteButton = event.target.closest("[data-delete-type]");
      if (!deleteButton) return;

      const type = deleteButton.dataset.deleteType;
      const id = deleteButton.dataset.id;

      if (!confirm("متأكد من حذف هذا السجل؟")) return;

      state[type] = state[type].filter(item => item.id !== id);
      saveState();
      render();
    });

    document.getElementById("app").addEventListener("change", event => {
      const select = event.target.closest("[data-status-type]");
      if (!select) return;

      const item = state[select.dataset.statusType]
        .find(row => row.id === select.dataset.id);

      if (item) {
        item.status = select.value;
        saveState();
        render();
      }
    });

    function memberOptions(selectedId = "") {
      if (state.members.length === 0) {
        return '<option value="">أضف عضوًا أولًا</option>';
      }

      return state.members.map(member =>
        `<option value="${esc(member.id)}" ${member.id === selectedId ? "selected" : ""}>
          ${esc(member.name)} — ${esc(member.number)}
        </option>`
      ).join("");
    }

    function dashboardPage() {
      const totalMembers = state.members.length;
      const activeMembers = state.members.filter(m => m.status === "active").length;
      const paid = state.subscriptions
        .filter(s => s.status === "paid")
        .reduce((sum, s) => sum + Number(s.amount || 0), 0);
      const openRequests = state.requests
        .filter(r => ["submitted", "under_review"].includes(r.status)).length;

      return `
        <div class="page-title">
          <div>
            <h2>الرئيسية</h2>
            <div class="muted">ملخص بيانات الصندوق المسجلة على هذا الجهاز</div>
          </div>
          <button class="btn secondary" id="exportButton">تنزيل نسخة احتياطية</button>
        </div>

        <section class="stats">
          <div class="stat"><div class="stat-label">إجمالي الأعضاء</div><div class="stat-value">${totalMembers}</div></div>
          <div class="stat"><div class="stat-label">الأعضاء النشطون</div><div class="stat-value">${activeMembers}</div></div>
          <div class="stat"><div class="stat-label">اشتراكات مدفوعة</div><div class="stat-value">${money(paid)}</div></div>
          <div class="stat"><div class="stat-label">طلبات قيد المتابعة</div><div class="stat-value">${openRequests}</div></div>
        </section>

        <section class="card">
          <h3>ابدأ من القائمة</h3>
          <p class="muted">أضف أعضاء الصندوق، وسجّل الاشتراكات والطلبات، ثم أضف اللوائح الداخلية.</p>
          <div class="actions">
            <button class="btn" data-shortcut="members">إضافة عضو</button>
            <button class="btn secondary" data-shortcut="subscriptions">تسجيل اشتراك</button>
            <button class="btn secondary" data-shortcut="requests">طلب مساعدة</button>
          </div>
        </section>

        <section class="card">
          <h3>ملاحظات الاستخدام</h3>
          <ul class="muted">
            <li>المعلومات لا تخرج من متصفح هذا الجهاز.</li>
            <li>زر النسخة الاحتياطية ينزّل ملف بيانات JSON.</li>
            <li>هذه النسخة للتجربة وليست نظامًا آمنًا لإدارة أموال حقيقية.</li>
          </ul>
        </section>
      `;
    }

    function membersPage() {
      const rows = state.members.map(member => `
        <tr>
          <td>${esc(member.number)}</td>
          <td>${esc(member.name)}</td>
          <td>${esc(member.phone || "—")}</td>
          <td>
            <select data-status-type="members" data-id="${esc(member.id)}">
              ${["active", "pending", "suspended"].map(status =>
                `<option value="${status}" ${member.status === status ? "selected" : ""}>
                  ${statusLabel(status)}
                </option>`
              ).
